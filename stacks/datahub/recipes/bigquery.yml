# BigQuery (the enterprise EDW) → DataHub. Runs only when GCP_SA_JSON is set
# (raw JSON or base64): ingest.sh writes it to the container's tmpfs and sets
# GOOGLE_APPLICATION_CREDENTIALS. Egress goes through px-proxy
# (INGEST_HTTPS_PROXY, set by the Makefile).
pipeline_name: bsp_bigquery
source:
  type: bigquery
  config:
    project_ids: ["${GCP_PROJECT_ID}"]
    env: ${DATAHUB_ENV}
    dataset_pattern:
      allow: ["^raw$", "^staging$", "^intermediate$", "^marts$", "^reference$", "^snapshots$"]
    include_table_lineage: true
    include_usage_statistics: false
    profiling:
      enabled: false
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true

# GMS has metadata-service auth ON; the ingest job authenticates with the
# DataHub system client (secret from the generated secrets file).
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    extra_headers:
      Authorization: "Basic __datahub_system:${DATAHUB_SYSTEM_CLIENT_SECRET}"
