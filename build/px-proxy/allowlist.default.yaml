# DataPlatform Data & AI Appliance — DEFAULT egress allowlist.
#
# px-proxy seeds data/egress/allowlist.yaml from this file the first time it
# starts (it never overwrites an existing allowlist). After that the live file
# is managed in Studio → Egress and hot-reloaded.
#
# Pattern syntax (build/px-proxy/policy.py):
#   pypi.org                 exact host (the apex is NOT covered by "*.")
#   *.pypi.org               any sub-domain, any depth
#   cdn-lfs*.huggingface.co  '*' inside a label stays inside that label
#   regex:^foo[0-9]+\.bar\.com$   full-match regex (rejected if too broad)
# ports: default [80, 443]; "any" allows every port (corporate domains only).
# tls: passthrough  → do not decrypt (for clients that pin certificates).
#
# Everything not listed is refused with HTTP 403 ("ask your appliance admin to
# allow it in Studio → Egress"). mode: audit allows everything but logs
# "would-block" — use it for a short discovery window only.

# Hosts configured through the environment are allowed in memory on top of
# this file (never written to it): SAP_BRIM_BASE_URL, ATLAN_BASE_URL,
# SHAREPOINT_SITE, OLLAMA_BASE_URL and EGRESS_EXTRA_HOSTS (comma-separated
# host[:port]) — see build/px-proxy/policy.py env_rules().

mode: enforce

rules:
  # ── DataPlatform corporate ─────────────────────────────────────────────
  - {pattern: "dataplatform.com", category: DataPlatform, reason: "Corporate domain", added_by: system, ports: any}
  - {pattern: "*.dataplatform.com", category: DataPlatform, reason: "Corporate domain (APIs, SAP BRIM, file shares, SSO)", added_by: system, ports: any}
  - {pattern: "*.scene7.com", category: DataPlatform, reason: "DataPlatform image CDN (scene7)", added_by: system, ports: [443]}
  - {pattern: "*.xtlo.net", category: DataPlatform, reason: "DataPlatform site assets (CDN)", added_by: system, ports: [443]}

