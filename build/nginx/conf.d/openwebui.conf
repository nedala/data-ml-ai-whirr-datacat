# Open WebUI (build/rag, profile `chatui`) — dedicated gated server.
#
# Open WebUI cannot be hosted under a sub-path, so it gets its own TLS server
# on container port 8444, published by the platform as ${OPENWEBUI_PORT}
# (37081 data · 37082 ml · 37083 ai). The Studio gate works here too: the
# `studio_session` cookie is host-scoped (Path=/, no Domain, no port), so the
# browser sends it to every port of the facade host.
#
# Identity: Studio's /studio/authz returns X-Auth-User/-Email/-Name/-Role;
# Open WebUI trusts X-Auth-Email (account key), X-Auth-Name (display name) and
# X-OWUI-Role (admin|user, mapped below from the Studio role). proxy_set_header
# REPLACES any client-sent copy of these headers, so they cannot be forged
# through nginx. Owner: rag component. (http{} context — conf.d is included there.)

map $auth_role $owui_role {
    admin    admin;
    default  user;
}

server {
    listen 8444 ssl;
    http2 on;
    server_name _;
    absolute_redirect off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # /_authz subrequest, @need_login (→ facade sign-in) / @forbidden / @not_running
    include /etc/nginx/snippets/authz.conf;

    location / {
        include /etc/nginx/snippets/gate.conf;
        set $upstream http://openwebui:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;       # X-Auth-* identity + websocket upgrade (5g body is the http default)
        proxy_set_header X-OWUI-Role $owui_role;
        proxy_buffering off;                           # streamed (SSE) completions
        proxy_cache off;
        proxy_request_buffering off;                   # large file uploads (knowledge, chat files)
        proxy_read_timeout 1h;                         # socket.io websocket + long generations
        proxy_send_timeout 1h;
    }
}
