# DataHub — optional side stack (stacks/datahub, plan/architecture.md §8).
# Dedicated gated server: DataHub's React UI expects to own "/", so it gets
# its own port instead of a sub-path. Compose publishes
#   ${DATAHUB_BIND:-127.0.0.1}:${DATAHUB_PORT}:8445   (38081 / 38082 / 38083)
#
# * Same certificates and Studio gate as the facade (snippets/authz.conf
#   /_authz); DataHub keeps its own sign-in too (native or Entra ID OIDC).
# * Lazy upstream (resolver + variable): nginx starts fine when DataHub is not
#   running; requests then get a "DataHub not running" page.
# * The gate is spelled out here instead of including snippets/gate.conf,
#   because that snippet's 502/503/504 page points at Studio, while DataHub
#   is started with `make datahub-up` (error_page is not overridable once
#   declared in the same location).

server {
    listen 8445 ssl;
    http2 on;
    server_name _;
    absolute_redirect off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # /_authz subrequest, @need_login / @forbidden (shared implementation)
    include /etc/nginx/snippets/authz.conf;

    # Everything (incl. DataHub's /callback/oidc) sits behind the Studio gate.
    location / {
        set $required_role "";
        auth_request /_authz;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_email $upstream_http_x_auth_email;
        auth_request_set $auth_name  $upstream_http_x_auth_name;
        auth_request_set $auth_role  $upstream_http_x_auth_role;
        error_page 401 = @need_login;
        error_page 403 = @forbidden;
        error_page 502 503 504 = @datahub_not_running;

        set $datahub_upstream http://datahub-frontend:9002;
        proxy_pass $datahub_upstream;
        include /etc/nginx/snippets/proxy.conf;
        # DataHub builds absolute redirects (OIDC) from these
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }

    location @datahub_not_running {
        default_type text/html;
        add_header Retry-After 15 always;
        return 503 '<!doctype html><meta charset="utf-8"><title>DataHub not running</title><body style="font:14px/1.5 system-ui,-apple-system,\'Segoe UI\',sans-serif;background:#eef0f2;color:#1c2127;display:grid;place-items:center;height:100vh;margin:0"><div style="background:#fff;padding:32px 40px;border-radius:8px;border-top:4px solid #0b6e79;box-shadow:0 4px 16px rgba(28,33,39,.12);max-width:480px"><div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7f7f7d;margin-bottom:6px">DataPlatform Data &amp; AI Appliance</div><h1 style="font-size:20px;margin:0 0 8px">DataHub isn&#39;t running</h1><p>DataHub is an optional side stack (open-source catalog and lineage). Start it on the appliance host with:</p><pre style="background:#f4f5f7;padding:10px 12px;border-radius:4px">make datahub-up APPLIANCE=data</pre><p>It takes 2&ndash;4 minutes on first start. This page refreshes on its own.</p><p><a style="color:#0b6e79;font-weight:600" href="/">Retry</a></p></div><script>setTimeout(function(){location.reload()},15000)</script>';
    }
}
