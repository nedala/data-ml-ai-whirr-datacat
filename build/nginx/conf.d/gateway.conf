# ── single-port gateway (Cloud Run / external Application Load Balancer) ──
#
# One plain-HTTP listener that serves the whole appliance the way the TLS
# facade does, so everything can sit behind ONE TLS-terminating hop instead of
# a listener per concern. TLS, HSTS and the public certificate belong to that
# upstream hop (Cloud Run terminates TLS on :443 and forwards to $PORT, default
# 8080; an external Application LB does the same to a serverless NEG).
#
# It reuses snippets/facade-locations.conf, so path routing and the Studio gate
# are byte-for-byte the same as conf.d/appliance.conf — the two can never drift.
# Keep this listener on 8080: that is Cloud Run's default $PORT. Pinning the
# deployed revision to `--port 8080` keeps it aligned.
#
# Ports that are deliberately NOT folded in here (they need their own host or
# loopback and are mapped to separate frontends on GCP — see
# docs/platform/cloud-run-readiness.md):
#   * Open WebUI  (8444) — cannot be hosted under a sub-path → own hostname
#   * DataHub     (8445) — its UI must own `/`              → own hostname
#   * CDP         (9222) — full browser control              → loopback only
#   * MCP         (8765) — laptop loopback; also on /mcp here
#   * direct noVNC(6080) — password-only, not gated          → loopback only
#   * SSO callback(8446) — Entra loopback redirect           → dropped on GCP
server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    # same-origin framing only (apps embed /browser/ in an iframe)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/facade-locations.conf;
}
