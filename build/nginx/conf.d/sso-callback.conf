# Loopback SSO callback (plain http, published on 127.0.0.1 only).
#
# Entra ID ignores the PORT when matching http://localhost redirect URIs
# (RFC 8252 loopback rule), so an already-registered
# http://localhost:<any>/auth/callback also matches
# http://localhost:${SSO_CALLBACK_PORT}/auth/callback. This server takes that
# one path and hands it to Studio's real callback; everything else is sent to
# the https facade. Studio's own cookies make the hop (host-only, path=/).
server {
    listen 8446;
    server_name localhost 127.0.0.1;
    absolute_redirect off;

    location = /auth/callback {
        set $upstream http://studio:8010;
        proxy_pass $upstream/studio/oidc/callback$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        return 302 $facade_origin$request_uri;
    }
}
