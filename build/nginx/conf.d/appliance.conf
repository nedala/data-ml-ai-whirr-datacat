# DataPlatform Data & AI Appliance — the single front door.
#
# * Upstreams resolve lazily (Docker DNS + variables) so nginx starts before
#   any profile service exists; not-yet-started routes render a friendly
#   "not running — start it in Studio" page instead of a bare 502.
# * Deny-by-default: every app location includes snippets/gate.conf, which
#   subrequests Studio (/studio/authz) with the signed session cookie.
#   Studio answers 204 (allow, + X-Auth-User/-Email/-Name/-Role) / 401 / 403.
# * Apps keep their OWN passwords too (Jupyter token, code-server) — defence
#   in depth.
# * Component routes live in routes.d/<component>.conf and are included
#   INSIDE the facade server block below.

resolver 127.0.0.11 valid=10s ipv6=off;

client_body_temp_path /tmp/nginx/body;
proxy_temp_path /tmp/nginx/proxy;
fastcgi_temp_path /tmp/nginx/fastcgi;
uwsgi_temp_path /tmp/nginx/uwsgi;
scgi_temp_path /tmp/nginx/scgi;

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    absolute_redirect off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # same-origin framing only (apps embed /browser/ in an iframe)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Routing + gate, shared with the single-port gateway (conf.d/gateway.conf).
    include /etc/nginx/snippets/facade-locations.conf;
}

# Browser DevTools protocol (CDP) for automation on this host. Compose
# publishes this port on 127.0.0.1 ONLY: CDP is full control of the browser,
# so it is never exposed on the facade.
server {
    listen 9222;
    server_name _;
    location / {
        set $cdp_upstream http://browser:9223;
        proxy_pass $cdp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        error_page 502 503 504 = @cdp_down;
    }
    location @cdp_down {
        default_type application/json;
        return 503 '{"error":"browser not running","hint":"start the Desktop browser capability in Studio"}';
    }
}

# Dedicated noVNC port (host ${NOVNC_BIND:-127.0.0.1}:${NOVNC_PORT}). NOT
# behind the Studio gate: the browser service's password-protected VNC
# server (VNC_PASSWORD from the vault) answers here. Loopback by default.
server {
    listen 6080;
    server_name _;
    location / {
        set $novnc_upstream http://browser:6081;
        proxy_pass $novnc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        error_page 502 503 504 = @novnc_down;
    }
    location @novnc_down {
        default_type text/plain;
        return 503 "Desktop not running (or VNC password not set) - start the Desktop browser capability in Studio\n";
    }
}

# MCP tools for MCP clients on this host. Published on 127.0.0.1 only;
# bearer-token auth in the MCP server.
server {
    listen 8765;
    server_name _;
    location / {
        set $mcp_upstream http://mcp:8095;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        error_page 502 503 504 = @mcp_down;
    }
    location @mcp_down {
        default_type application/json;
        return 503 '{"error":"MCP tools not running","hint":"start the AI capability in Studio"}';
    }
}
