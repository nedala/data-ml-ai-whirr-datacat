# The facade's request-routing locations — shared verbatim by the TLS facade
# (conf.d/appliance.conf, listen 443) and the optional plain-HTTP single-port
# gateway (conf.d/gateway.conf, listen 8080). Include INSIDE a server block.
#
# Factored out so the two entry points can never drift: the gateway exists so
# the whole appliance can sit behind one TLS-terminating hop (Cloud Run / an
# external Application Load Balancer), which needs plain HTTP on $PORT.

# /_authz subrequest, @need_login / @forbidden / @not_running
include /etc/nginx/snippets/authz.conf;

# ── PUBLIC: Studio (renders its own sign-in; enforces auth itself) ──
location = / { return 302 /studio/; }

# Studio's in-network endpoints (delegated Graph tokens for the MCP server)
# are never reachable through the front door.
location ^~ /studio/internal/ { return 404; }

location ^~ /studio/ {
    limit_req zone=auth burst=40 nodelay;
    set $upstream http://studio:8010;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# ── component routes (platform.conf + one file per component) ───────
include /etc/nginx/routes.d/*.conf;

location / { return 302 /studio/; }
