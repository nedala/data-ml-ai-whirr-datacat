# Facade gate — include inside every application location (and in every
# extra gated server, e.g. conf.d/openwebui.conf).
# Requires a valid Studio session; the per-location role floor is in
# $required_role (set BEFORE this include; empty = any signed-in user).
# Identity forwarded to the app by snippets/proxy.conf:
#   X-Auth-User (handle) · X-Auth-Email · X-Auth-Name · X-Auth-Role
auth_request /_authz;
auth_request_set $auth_user  $upstream_http_x_auth_user;
auth_request_set $auth_email $upstream_http_x_auth_email;
auth_request_set $auth_name  $upstream_http_x_auth_name;
auth_request_set $auth_role  $upstream_http_x_auth_role;
error_page 401 = @need_login;
# (error_page is NOT inherited once a location declares one — so all of them
#  are declared here together.)
error_page 403 = @forbidden;
error_page 502 503 504 = @not_running;
