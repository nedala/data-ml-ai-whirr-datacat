# Studio authz subrequest + the friendly error pages. Included once per
# gated server block (appliance.conf, and component servers such as
# conf.d/openwebui.conf), so every server shares one implementation.
set $auth_user "";
set $auth_email "";
set $auth_name "";
set $auth_role "";
set $required_role "";

location = /_authz {
    internal;
    set $authz_upstream http://studio:8010;
    proxy_pass $authz_upstream/studio/authz;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Required-Role $required_role;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
}

# Not signed in: APIs get JSON, browsers go to the Studio sign-in page on the
# facade (absolute URL, so a gated server on another port lands there too).
location @need_login {
    if ($request_uri ~ "^/[a-z0-9-]+/api/") {
        add_header Content-Type application/json always;
        return 401 '{"error":"unauthorized","login":"/studio/login"}';
    }
    return 302 $studio_login_url;
}

location @forbidden {
    default_type text/html;
    return 403 '<!doctype html><meta charset="utf-8"><title>Not allowed</title><body style="font:14px/1.5 system-ui,-apple-system,\'Segoe UI\',sans-serif;background:#eef0f2;color:#1c2127;display:grid;place-items:center;height:100vh;margin:0"><div style="background:#fff;padding:32px 40px;border-radius:8px;border-top:4px solid #0b6e79;box-shadow:0 4px 16px rgba(28,33,39,.12);max-width:440px"><div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7f7f7d;margin-bottom:6px">DataPlatform Data &amp; AI Appliance</div><h1 style="font-size:20px;margin:0 0 8px">You don&#39;t have access to this service</h1><p>Your account is signed in, but its role is below what this service requires. Ask an appliance admin to change your role in Studio.</p><p><a style="color:#0b6e79;font-weight:600" href="/studio/">Back to Studio</a></p></div>';
}

# Upstream down (profile not started yet) → friendly page.
location @not_running {
    default_type text/html;
    add_header Retry-After 8 always;
    return 503 '<!doctype html><meta charset="utf-8"><title>Not running</title><body style="font:14px/1.5 system-ui,-apple-system,\'Segoe UI\',sans-serif;background:#eef0f2;color:#1c2127;display:grid;place-items:center;height:100vh;margin:0"><div style="background:#fff;padding:32px 40px;border-radius:8px;border-top:4px solid #0b6e79;box-shadow:0 4px 16px rgba(28,33,39,.12);max-width:460px"><div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7f7f7d;margin-bottom:6px">DataPlatform Data &amp; AI Appliance</div><h1 style="font-size:20px;margin:0 0 8px">This service isn&#39;t running yet</h1><p>Add it to your appliance in Studio — most services start in under a minute. If you just started it, this page refreshes on its own.</p><p><a style="display:inline-block;background:#0b6e79;color:#fff;padding:8px 16px;border-radius:4px;text-decoration:none;font-weight:600" href="/studio/#compose">Open Studio</a></p><script>setTimeout(function(){location.reload()},8000)</script></div>';
}
