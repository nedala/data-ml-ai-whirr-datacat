# Common upstream headers + websocket upgrade.
proxy_set_header Host $http_host;
proxy_set_header X-Auth-User $auth_user;
proxy_set_header X-Auth-Email $auth_email;
proxy_set_header X-Auth-Name $auth_name;
proxy_set_header X-Auth-Role $auth_role;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Body size and timeouts are http-level defaults in nginx.conf so a location
# can override them without a duplicate-directive error.
