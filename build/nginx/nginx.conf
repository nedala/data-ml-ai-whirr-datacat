# Main nginx config for the front-door service (non-root uid 1000).
# Logs go to stdout/stderr; pid + temp paths live under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Defaults every location inherits (and may override).
    client_max_body_size 5g;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # rendered at start by the nginx entrypoint (FACADE_PORT → sign-in URL
    # used by gated servers on other ports)
    include /tmp/nginx/runtime.conf;

    # Server blocks: conf.d/appliance.conf (the facade, which includes
    # routes.d/*.conf INSIDE its server block) plus any component server
    # (e.g. conf.d/openwebui.conf on its own port).
    include /etc/nginx/conf.d/*.conf;
}
