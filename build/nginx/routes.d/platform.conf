# Platform routes (included inside the facade server block).
# Owner: platform. Other components add routes.d/<component>.conf.

# ── control plane ────────────────────────────────────────────────────────
location /docs/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://docs:8005;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
location = /docs { return 301 /docs/; }

# ── workspace (appliance): JupyterLab ────────────────────────────────────
location /jupyter/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://appliance:8888;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
location = /jupyter { return 301 /jupyter/; }

# Workbench: packages (/pkg/), files (/files/), import & export (/ingress/)
# and dbt Studio (/dbt/) — one FastAPI app on :8002
location /pkg/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://appliance:8002;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;               # streamed install logs
}
location /files/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://appliance:8002;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;       # large uploads stream straight through
    proxy_buffering off;
}
location /ingress/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://appliance:8002;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;
    proxy_buffering off;               # SSE job logs + streamed downloads
}
location /dbt/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://appliance:8002;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;               # streamed dbt logs
}
location = /pkg { return 301 /pkg/; }
location = /files { return 301 /files/; }
location = /ingress { return 301 /ingress/; }
location = /dbt { return 301 /dbt/; }

# ── VS Code (code-server has no base-path flag: strip the prefix) ────────
location /code/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://code:8080;
    rewrite ^/code/(.*)$ /$1 break;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
# keep the query: code-server redirects to /code?folder=… after login
location = /code { return 301 /code/$is_args$args; }

# ── Desktop (noVNC) — gated; the password-less VNC server behind it ──────
# /browser/vnc.html?autoconnect=1&resize=scale[&view_only=1]&path=browser/websockify
# Embeddable in a same-origin iframe (X-Frame-Options SAMEORIGIN).
location /browser/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://browser:6080;
    # noVNC files change with the Desktop image: always revalidate
    expires -1;
    rewrite ^/browser/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1d;             # long-lived VNC websocket
    proxy_send_timeout 1d;
}
location = /browser { return 301 /browser/; }
