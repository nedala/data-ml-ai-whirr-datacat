# Knowledge & RAG service (build/rag) — UI, API and the OpenAPI tool server.
# FastAPI serves natively under /rag (no prefix strip). Owner: rag component.
location /rag/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://rag:8101;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;       # large document uploads stream through
    proxy_buffering off;
}
location = /rag { return 301 /rag/; }
