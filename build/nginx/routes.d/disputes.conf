# ── Dispute Desk — service `disputes:8099`, profile `disputes` ──
# FastAPI serves natively under /disputes/ (no prefix stripping).
location /disputes/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://disputes:8099;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
location = /disputes { return 301 /disputes/; }
