# ── Enterprise connectors — service `connectors:8092`, profile `connectors` ──
# FastAPI serves natively under /connectors/ (no prefix stripping).
location /connectors/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://connectors:8092;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;       # SharePoint uploads stream through
}
location = /connectors { return 301 /connectors/; }
