# ── MLOps — profile `mlops` (build/mlops) ────────────────────────────────
# Every app is hosted natively under its prefix (no prefix stripping):
#   MLflow 3 --static-prefix /mlflow · FastAPI root_path /serve and /mlops.
location /mlflow/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://mlflow:5000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    client_max_body_size 2g;           # model / artifact uploads via the artifact proxy
    proxy_request_buffering off;
}
location = /mlflow { return 301 /mlflow/; }

location /serve/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://model-gateway:8098;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
location = /serve { return 301 /serve/; }

location /mlops/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://mlops:8097;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 900s;           # freeze / materialise / batch scoring run inline
}
location = /mlops { return 301 /mlops/; }
