# ── Superset (BI) — service `superset:8088`, profile `bi` ─────────────────
# Superset 6 is hosted natively under SUPERSET_APP_ROOT=/superset, so the
# path is passed through UNCHANGED (no rewrite). Health: /superset/healthz.
location /superset/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://superset:8088;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
location = /superset { return 301 /superset/$is_args$args; }
