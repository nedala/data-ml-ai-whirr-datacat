# ── Integration canvas — service `canvas:8093`, profile `canvas` ─────────
# FastAPI serves natively under /canvas/ (no prefix stripping).
location /canvas/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://canvas:8093;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;       # file uploads stream through
    proxy_buffering off;               # run-log polling stays fresh
}
location = /canvas { return 301 /canvas/; }
