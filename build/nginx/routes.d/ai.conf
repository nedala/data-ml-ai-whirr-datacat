# ── AI harness — service `harness:8096`, profile `ai` ─────────────────────
# FastAPI serves natively under /ai/ (UI, /ai/api/*, OpenAI-compatible /ai/v1/*).
# SSE-friendly: chat streaming, agent events and Ollama pulls must not buffer.
location /ai/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://harness:8096;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    # proxy.conf already sets 600 s read/send timeouts and a 5 GB body limit (VLM images fit).
}
location = /ai { return 301 /ai/; }

# ── MCP tools — service `mcp:8095`, profile `ai` ──────────────────────────
# Called by MCP clients, not browsers: no cookie gate — the server checks
# `Authorization: Bearer <MCP_TOKEN>` itself (/mcp/info, /mcp/tools.json and
# /healthz carry no data). Streamable HTTP: no buffering, long reads.
location /mcp {
    set $upstream http://mcp:8095;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;
    proxy_cache off;
}

# Laptop loopback 127.0.0.1:${MCP_PORT:-8765} → mcp:8095 is a separate
# `server { listen 8765; }` block, so it cannot live in this file (routes.d is
# included inside the facade server). It is in build/nginx/conf.d/appliance.conf
# (platform-owned), with the port published on 127.0.0.1 only.
