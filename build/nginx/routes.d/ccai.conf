# CCAI Call Insights (build/ccai) — gated by Studio; served natively under /ccai/.
# Body size and timeouts come from snippets/proxy.conf (5g / 600s); a location
# must not repeat them — nginx rejects duplicate directives.
location /ccai/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://ccai:8100;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Live run progress (server-sent events): unbuffered, long-lived. Sets its own
# proxy headers instead of including proxy.conf so the 1h read timeout and the
# keep-alive Connection header don't collide with the shared snippet.
location = /ccai/api/events {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://ccai:8100;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Email $auth_email;
    proxy_set_header X-Auth-Name $auth_name;
    proxy_set_header X-Auth-Role $auth_role;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
}
