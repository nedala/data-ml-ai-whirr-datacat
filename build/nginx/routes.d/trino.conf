# ── Trino (federated SQL) — service `trino:8080`, profile `trino` ─────────
# Trino has no base-path setting and its web UI hard-codes absolute /ui/…
# URLs (assets, API calls, router base). So under /trino/:
#   * the prefix is stripped before proxying (/trino/ui/ → /ui/),
#   * absolute "/ui/" strings in HTML/JS/CSS responses are rewritten to
#     "/trino/ui/" (sub_filter; upstream compression disabled for that),
#   * redirects (/ → /ui/, login) are re-prefixed.
# The UI runs as a fixed user (web-ui.authentication.type=fixed) — the
# Studio gate is the authentication. JDBC/CLI clients inside the appliance
# talk to http://trino:8080 directly; /trino/v1/ is also proxied for
# clients outside (e.g. DBeaver on the laptop through the facade).
location /trino/ {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://trino:8080;
    rewrite ^/trino/(.*)$ /$1 break;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /trino/$1;
    sub_filter_types application/javascript text/javascript text/css application/json;
    sub_filter_once off;
    sub_filter '"/ui/'  '"/trino/ui/';
    sub_filter "'/ui/"  "'/trino/ui/";
    sub_filter '`/ui/'  '`/trino/ui/';
    sub_filter '"/ui"'  '"/trino/ui"';
}
location = /trino { return 301 /trino/ui/; }
location = /trino/ { return 301 /trino/ui/; }
# health for the launchpad / Studio probes: GET /trino/healthz → Trino /v1/info
location = /trino/healthz {
    include /etc/nginx/snippets/gate.conf;
    set $upstream http://trino:8080;
    rewrite ^ /v1/info break;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}
