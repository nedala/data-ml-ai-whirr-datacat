<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispute Desk · DataPlatform AI Engineer</title>
<link rel="icon" href="/disputes/ui-kit/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/disputes/ui-kit/bsp.css">
<link rel="stylesheet" href="/disputes/static/app.css">

<body>
<div class="bsp-app">
  <header class="bsp-topbar">
    <div class="bsp-brand"><span class="mark"></span>Dispute Desk <span class="sub">billing disputes → SAP BRIM</span></div>
    <span class="spacer"></span>

    <a class="btn secondary sm" id="watch-live" href="/browser/" target="_blank" rel="noopener">Watch live</a>
  </header>
  <nav class="bsp-sidebar">
    <div class="bsp-nav">
      <div class="bsp-nav-group eyebrow">Work</div>
      <a href="#queue" data-view="queue">Review queue <span class="badge info" id="n-review"></span></a>
      <a href="#inbox" data-view="inbox">Inbox</a>
      <a href="#submissions" data-view="submissions">Submissions <span class="badge neutral" id="n-approved"></span></a>
      <div class="bsp-nav-group eyebrow">Insight</div>
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#settings" data-view="settings">Settings</a>
    </div>
  </nav>
  <main class="bsp-main" id="main"></main>
</div>
