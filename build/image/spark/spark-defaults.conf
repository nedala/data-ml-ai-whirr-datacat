# Spark defaults for the workspace image (SPARK_CONF_DIR=/opt/spark-conf).
# Read by spark-submit, so they apply to notebooks (pyspark launches
# spark-submit under the hood) and to `spark-submit script.py` alike.
# Per-session overrides: SparkSession.builder.config(...) or --conf.
#
# Driver memory comes from the SPARK_DRIVER_MEMORY env var (default 2g, set in
# the image) — spark-submit reads it; spark.driver.memory below would win, so
# it is deliberately NOT set here.

# the PostgreSQL JDBC driver, baked into the image (runtime egress is allowlisted)
spark.jars                                /opt/spark-jars/postgresql.jar
spark.ui.showConsoleProgress              false
spark.sql.session.timeZone                UTC
# small, single-machine data: 200 shuffle partitions would be mostly empty
spark.sql.shuffle.partitions              8
spark.sql.adaptive.enabled                true
# overwrite only the partitions a job writes (re-running one month keeps the rest)
spark.sql.sources.partitionOverwriteMode  dynamic
# keep scratch out of ~/work (shuffle/spill scratch goes to /tmp by default)
spark.sql.warehouse.dir                   /tmp/spark-warehouse
