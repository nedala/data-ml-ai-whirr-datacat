# Superset — capability `bi` (requires workspace). Merged into the Studio catalog.
services:
  superset:
    title: Superset
    blurb: Pre-built DataPlatform dashboards (executive, fiber, network, sentiment, billing, churn, revenue bridge, AI & ML ops) and SQL Lab
    profile: bi
    ram_mb: 1024
    kind: app
    route: /superset/
    health: /superset/healthz
    needs: [postgres]
    soft_needs: [trino]
    endpoints:
      - {label: Dashboards, value: "/superset/dashboard/list/"}
      - {label: SQL Lab, value: "/superset/sqllab/"}
      - {label: "Refresh dashboards (after dbt build / new AI-ML data)", value: "make superset-refresh  ·  build/superset/refresh.sh"}
    creds:
      - {env: SUPERSET_ADMIN_PASS, user: admin, label: Superset admin}
      - {env: SUPERSET_SECRET_KEY, label: Superset session signing key, hidden: true, length: 48}
    actions:
      - id: superset-refresh
        label: Refresh dashboards
        blurb: Re-run the idempotent bootstrap — adds AI & ML sections once mlops / ccai / disputes tables exist
        exec: ["/opt/venvs/superset/bin/python", "/opt/superset-assets/bootstrap_dashboards.py"]

apps:
  - {id: superset, group: report, title: Superset, service: superset, path: /superset/, cred: SUPERSET_ADMIN_PASS, icon: dashboard, blurb: "Dashboards for churn, revenue and billing, plus SQL Lab"}

capabilities:
  bi: {title: Dashboards, tone: report, icon: dashboard, services: [superset], requires: [workspace], blurb: "Superset with eight pre-built DataPlatform dashboards"}
