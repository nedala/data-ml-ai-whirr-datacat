# `billing_oracle`: the demo Oracle billing system (build/demo-sources, schema BILLING),
# read-only through the `billing` application user. Rendered only when
# BILLING_ORA_PASSWORD is set (Demo sources capability running).
connector.name=oracle
connection-url=jdbc:oracle:thin:@//${ENV:DEMO_ORACLE_HOST}:1521/FREEPDB1
connection-user=billing
connection-password=${ENV:BILLING_ORA_PASSWORD}
oracle.number.default-scale=4
oracle.number.rounding-mode=HALF_UP
case-insensitive-name-matching=true
