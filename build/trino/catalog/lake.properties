# `lake` — Hive tables over files in the shared lake folder (/data/lake)
# with a file-based metastore in /data/lake/.trino-metastore (no HMS).
#
#   -- managed tables (Trino writes them under .trino-metastore/<schema>/<table>/)
#   CREATE SCHEMA lake.scratch;
#   CREATE TABLE lake.scratch.revenue WITH (format = 'PARQUET') AS SELECT ...;
#   -- external tables over a FOLDER of parquet / csv files you dropped in
#   CREATE TABLE lake.landing.cdrs (ban varchar, ...) WITH (
#       format = 'PARQUET', external_location = 'local:///landing/cdrs');
#
# (Do not give schemas a `location`: the file metastore reads managed tables
# from its own directory.)
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///.trino-metastore
fs.local.enabled=true
local.location=/data/lake
hive.metastore.disable-location-checks=true
hive.non-managed-table-writes-enabled=true
hive.storage-format=PARQUET
hive.recursive-directories=true
