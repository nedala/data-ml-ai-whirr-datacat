# `care_mssql`: the demo SQL Server customer-care system (build/demo-sources, database
# `care`), read through the `canvas_reader` login. Rendered only when
# CARE_MSSQL_PASSWORD is set (Demo sources capability running).
connector.name=sqlserver
connection-url=jdbc:sqlserver://${ENV:DEMO_MSSQL_HOST}:1433;databaseName=care;encrypt=false
connection-user=canvas_reader
connection-password=${ENV:CARE_MSSQL_PASSWORD}
case-insensitive-name-matching=true
