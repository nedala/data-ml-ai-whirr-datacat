# `warehouse` — the local Postgres EDW (bsp_edw) through Trino's PostgreSQL
# connector: raw, staging, intermediate, marts, reference, snapshots, …
# The password comes from the container environment (vault → Studio).
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:PG_HOST}:${ENV:PG_PORT}/${ENV:PG_DB}
connection-user=${ENV:PG_USER}
connection-password=${ENV:PG_PASS}
case-insensitive-name-matching=true
postgresql.array-mapping=AS_ARRAY
# push joins / aggregates / LIMIT down to Postgres where possible
join-pushdown.enabled=true
