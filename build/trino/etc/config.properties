# Trino single-node coordinator for the DataPlatform appliances (compose
# service `trino`, port 8080, internal network only; UI via nginx /trino/ui/).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Catalog files are rendered at start (entrypoint.sh) into a writable dir:
# static catalogs from /etc/trino-bsp/catalog + `bigquery` when GCP_SA_JSON is set.
catalog.config-dir=/tmp/trino-catalog
# nginx (the Studio-gated front door) forwards X-Forwarded-* headers.
http-server.process-forwarded=true
# The Studio gate authenticates users; the UI runs as a fixed identity.
web-ui.enabled=true
web-ui.authentication.type=fixed
web-ui.user=${ENV:TRINO_UI_USER}
# Modest defaults for a laptop/VM; raise with TRINO_JVM_* in jvm.config.
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
# Cost guard (BigQuery bills scanned bytes to the execution project): no query
# runs longer than this; override with TRINO_QUERY_MAX_EXECUTION_TIME.
query.max-execution-time=${ENV:TRINO_QUERY_MAX_EXECUTION_TIME}
