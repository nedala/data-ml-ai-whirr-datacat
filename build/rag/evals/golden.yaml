# Golden Q&A set over the synthetic front-office corpus (build/rag/corpus).
# expected_docs: doc_ids that contain the answer (document-level hit@k / MRR).
# facts: short strings that a correct answer should contain (fact recall).
# Questions with no expected_docs are out of scope: the right answer is
# "I don't know" (abstention accuracy).
version: 1
questions:
