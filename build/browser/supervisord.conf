; Desktop container programs (rendered by browser-entrypoint into /tmp/desktop).
; Every program restarts on exit; logs go to the container's stdout.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/desktop/supervisord.pid
childlogdir=/tmp/desktop

[unix_http_server]
file=/tmp/desktop/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/desktop/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
priority=10
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_BROWSER_GEOMETRY)s -nolisten tcp -dpi 96 +extension RANDR -noreset
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
priority=15
command=/usr/bin/dbus-daemon --session --address=unix:path=/tmp/desktop/dbus.sock --nofork --nopidfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfsettingsd]
priority=20
command=/usr/local/bin/appliance-xfce xfsettingsd --no-daemon --sm-client-disable
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfwm4]
priority=25
command=/usr/local/bin/appliance-xfce xfwm4 --compositor=off --sm-client-disable
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfce4-panel]
priority=30
command=/usr/local/bin/appliance-xfce xfce4-panel --sm-client-disable
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfdesktop]
priority=30
command=/usr/local/bin/appliance-xfce xfdesktop --sm-client-disable
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chromium]
priority=40
command=/usr/local/bin/appliance-chromium
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; password-less VNC on loopback, reached only through websockify :6080 (nginx /browser/, Studio-gated)
[program:x11vnc]
priority=50
command=/usr/local/bin/appliance-wait-x /usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport 5900 -localhost -listen 127.0.0.1 -nopw -forever -shared -noxdamage -quiet -noipv6
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; password-protected VNC for the dedicated host port (VNC_PASSWORD)
[program:x11vnc-pw]
priority=50
command=/usr/local/bin/appliance-wait-x /usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport 5901 -localhost -listen 127.0.0.1 -rfbauth /tmp/desktop/vncpasswd -forever -shared -noxdamage -quiet -noipv6
autostart=@DIRECT_VNC@
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=60
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-direct]
priority=60
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6081 127.0.0.1:5901
autostart=@DIRECT_VNC@
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; CDP for appliance-net clients (Playwright: http://browser:9223)
[program:cdp]
priority=60
command=/usr/local/bin/python /usr/local/lib/appliance/cdp_proxy.py
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Loopback aliases so a browser *inside this container* can reach the
; appliance as "localhost": the https facade, and Entra's loopback SSO
; callback (its registered redirect_uri is http://localhost:<port>/auth/callback).
; Both forward to the nginx service. See docs/platform/sso.md § "Linux Desktop".
[program:facade-loopback]
priority=60
command=/usr/bin/socat TCP-LISTEN:%(ENV_FACADE_PORT)s,fork,reuseaddr TCP:nginx:443
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sso-loopback]
priority=60
command=/usr/bin/socat TCP-LISTEN:%(ENV_SSO_CALLBACK_PORT)s,fork,reuseaddr TCP:nginx:8446
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
