            mapping: {ticket_category: account, ticket_subcategory: update_payment, sap_reason: ZC21}
            churn_risk: false
          - id: ACC.PRIV.PRIVACY_REQUEST
            name: Privacy & do-not-contact
            definition: Customer asks about personal data, wants to opt out of marketing calls, or makes a data request.
            include: Stop calling me with offers; do not call list; what data do you keep.
            exclude: Outage alert preferences (OUT.NOT.OUTAGE_ALERTS).
            examples:
              - "Please put me on your do not call list."
              - "Stop sending me sales offers."
              - "What personal information do you keep about me?"
