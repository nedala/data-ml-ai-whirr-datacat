            mapping: {ticket_category: account, ticket_subcategory: update_payment, sap_reason: ZC22}
            churn_risk: false

  # ─────────────────────────────────────────────────────────────── 8 leaves
  - id: EQP
    name: Equipment
    groups:
      - id: EQP.MOD
        name: Modem & router
        leaves:
          - id: EQP.MOD.MODEM_FAULT
            name: Modem / router fault
            definition: The modem, router or ONT appears faulty — red or blinking lights, won't power on, overheating.
            include: Red light on modem; router dead; power supply broken.
            exclude: No internet with normal lights (TEC.CON.NO_INTERNET).
            examples:
              - "The light on my modem is blinking red."
              - "My router won't turn on at all."
              - "The box is really hot and keeps rebooting itself."
            keywords: [red light, blinking, modem, router won't turn on, rebooting, power light, dead, ont, fiber box, dsl modem]
            mapping: {ticket_category: technical, ticket_subcategory: equipment_fault, sap_reason: ZE01}
            churn_risk: false
          - id: EQP.MOD.REPLACE_UPGRADE
            name: Replace / upgrade equipment
            definition: Customer wants a newer modem/router (e.g. Wi-Fi 6/7) or a replacement for old equipment that still works.
            include: Newer router; my modem is old; Wi-Fi 6 upgrade.
            exclude: Faulty equipment (EQP.MOD.MODEM_FAULT).
            examples:
              - "My modem is like eight years old, can I get a new one?"
              - "Do you have a wifi six router I can upgrade to?"
              - "I want to swap my router for the newer model."
            keywords: [new router, old modem, upgrade router, wifi 6, newer model, swap, replacement]
            mapping: {ticket_category: technical, ticket_subcategory: equipment_fault, sap_reason: ZE02}
            churn_risk: false
          - id: EQP.MOD.OWN_EQUIPMENT
            name: Use own router (BYOD)
            definition: Customer wants to use their own modem/router, or asks about compatibility and removing the rental.
            include: Can I use my own router; compatible modems; bought a Netgear.
            exclude: Port forwarding/bridge mode configuration (TEC.SVC.STATIC_IP).
            examples:
              - "Can I use my own router instead of renting yours?"
              - "I bought a Netgear, will it work with your service?"
              - "Which modems are compatible with DSL?"
            keywords: [my own router, compatible, netgear, buy my own, instead of renting, byod, eero]
            mapping: {ticket_category: technical, ticket_subcategory: equipment_fault, sap_reason: ZE03}
            churn_risk: false
          - id: EQP.MOD.SETUP_ACTIVATE
            name: Self-install & activation
            definition: Help setting up or activating a self-install kit or newly received equipment.
            include: Self install kit; activate my modem; setup app stuck.
            exclude: Equipment that hasn't arrived (EQP.SHP.SHIPMENT_STATUS).
            examples:
              - "I got the self install kit and I can't get it activated."
              - "How do I set up the new modem you sent me?"
              - "The activation keeps failing on the last step."
            keywords: [self install, activate, activation, set up the modem, kit, setup]
            mapping: {ticket_category: installation, ticket_subcategory: install_delay, sap_reason: ZE04}
            churn_risk: false
      - id: EQP.RTN
        name: Returns & fees
        leaves:
          - id: EQP.RTN.RETURN_EQUIPMENT
            name: Return equipment
            definition: How and where to return equipment after cancellation, swap or upgrade; return label/box.
            include: Return label; UPS store drop-off; where do I send the modem.
            exclude: Charged a non-return fee (EQP.RTN.UNRETURNED_FEE).
            examples:
              - "How do I return the modem now that I've cancelled?"
              - "Can you send me a return label?"
              - "Can I drop the equipment off at a UPS store?"
            keywords: [return, return label, ups, send back, drop off, box, return the modem]
            mapping: {ticket_category: account, ticket_subcategory: cancel_request, sap_reason: ZE11}
            churn_risk: false
          - id: EQP.RTN.UNRETURNED_FEE
            name: Unreturned equipment fee
            definition: Customer disputes a fee for equipment the company says was not returned.
            include: Charged for modem I returned; non-return fee; tracking number proof.
            exclude: Final bill disputes without equipment (RET.FIN.FINAL_BILL).
            examples:
              - "I got charged a hundred and fifty dollars for a modem I already returned."
              - "I have the tracking number, why is there an unreturned equipment fee?"
              - "You're billing me for equipment I sent back a month ago."
            keywords: [unreturned, non return fee, already returned, tracking number, equipment fee, sent back]
            mapping: {ticket_category: billing, ticket_subcategory: incorrect_charge, sap_reason: ZE12}
            churn_risk: false
          - id: EQP.RTN.LEASE_FEE
            name: Equipment rental fee
            definition: Questions about the monthly modem/router rental or lease fee.
            include: Why am I paying for the modem every month; rental charge; purchase instead.
            exclude: Using own router (EQP.MOD.OWN_EQUIPMENT) when that is the main ask.
            examples:
              - "Why am I paying fifteen dollars a month for the modem?"
              - "Is there a way to stop the equipment rental fee?"
              - "I thought the router was included with fiber."
            keywords: [rental fee, lease, modem fee, every month, equipment charge, included]
            mapping: {ticket_category: billing, ticket_subcategory: incorrect_charge, sap_reason: ZE13}
            churn_risk: false
      - id: EQP.SHP
        name: Shipping
        leaves:
          - id: EQP.SHP.SHIPMENT_STATUS
            name: Equipment shipment status
            definition: Equipment or self-install kit has not arrived, tracking questions, wrong item shipped.
            include: Where is my modem; tracking number; package never came; wrong box.
            exclude: Order status for service (ORD.STAT.ORDER_STATUS).
            examples:
              - "My modem was supposed to arrive Monday and it's not here."
              - "Can I get a tracking number for the equipment you shipped?"
              - "The box says delivered but I never got it."
            keywords: [shipped, tracking, arrive, delivered, package, never got it, shipment]
            mapping: {ticket_category: installation, ticket_subcategory: install_delay, sap_reason: ZE21}
            churn_risk: false

  # ─────────────────────────────────────────────────────────────── 7 leaves
  - id: FBR
    name: Fiber Upgrade & Availability
    groups:
      - id: FBR.AVL
        name: Availability
        leaves:
          - id: FBR.AVL.FIBER_AVAILABILITY
            name: Is fiber available
            definition: Customer asks whether fiber service is available at their address right now.
            include: Can I get fiber; is Quantum Fiber/DataPlatform Fiber at my house; checking availability.
            exclude: When will it come (FBR.AVL.BUILD_TIMELINE).
            examples:
              - "Is fiber available at my address yet?"
              - "Can you check if I can get fiber at my house?"
              - "My neighbor has fiber, can I get it too?"
            keywords: [fiber available, check availability, can i get fiber, my address, neighbor has fiber]
            mapping: {ticket_category: account, ticket_subcategory: plan_change, sap_reason: ZF01}
            churn_risk: false
          - id: FBR.AVL.BUILD_TIMELINE
            name: Fiber build timeline
            definition: Customer asks when fiber will be built or reach their street/area.
            include: When is fiber coming; build schedule; saw crews, when can I order.
            exclude: Available now (FBR.AVL.FIBER_AVAILABILITY).
            examples:
              - "When is fiber coming to my street?"
              - "You've been saying fiber is coming for two years, when will it be ready?"
              - "I saw crews putting in fiber, when can I order it?"
            keywords: [when is fiber coming, timeline, build, coming to my street, years, when can i order]
            mapping: {ticket_category: account, ticket_subcategory: plan_change, sap_reason: ZF02}
            churn_risk: true
          - id: FBR.AVL.ADDRESS_NOT_FOUND
            name: Address not found / serviceability
            definition: Address cannot be found in the system or shows as not serviceable although customer believes it is.
            include: Website says my address doesn't exist; new construction address; unit number missing.
            exclude: Moving service where address is found (ORD.MOVE.MOVE_SERVICE).
            examples:
              - "Your website says my address doesn't exist."
              - "It's a new build and my address won't come up."
              - "The system can't find my apartment number."
            keywords: [address doesn't exist, can't find my address, new build, new construction, apartment number, not serviceable]
            mapping: {ticket_category: account, ticket_subcategory: plan_change, sap_reason: ZF03}
            churn_risk: false
      - id: FBR.MIG
        name: Copper-to-fiber migration
        leaves:
          - id: FBR.MIG.COPPER_TO_FIBER
            name: Upgrade DSL to fiber
            definition: Existing copper DSL customer wants to upgrade to fiber now that it is available.
            include: Switch from DSL to fiber; got a fiber offer letter; upgrade my copper line.
            exclude: Same-technology speed upgrade (ORD.PLAN.UPGRADE_SPEED).
            examples:
              - "I have DSL and I got a flyer that fiber is available, I want to switch."
              - "How do I upgrade from my old copper internet to fiber?"
              - "Can you move me from DSL to the fiber gig plan?"
            keywords: [dsl, copper, switch to fiber, upgrade to fiber, flyer, fiber offer, old internet]
            mapping: {ticket_category: account, ticket_subcategory: plan_change, sap_reason: ZF11}
            churn_risk: false
          - id: FBR.MIG.COPPER_RETIREMENT
            name: Copper retirement notice
            definition: Customer received a notice that the copper network is being retired and asks what it means or objects.
            include: Letter saying my DSL is being discontinued; forced migration; copper retirement.
            exclude: Voluntary upgrade (FBR.MIG.COPPER_TO_FIBER).
            examples:
              - "I got a letter saying my DSL service is being discontinued."
              - "Why are you forcing me off my copper line?"
              - "What happens to my phone line when you retire the copper?"
            keywords: [discontinued, retire, retirement, forcing me, letter, copper network, being shut off]
            mapping: {ticket_category: account, ticket_subcategory: plan_change, sap_reason: ZF12}
            churn_risk: true
          - id: FBR.MIG.MIGRATION_ISSUE
            name: Post-migration issue
            definition: Problems after moving from copper to fiber — phone number port, alarm/medical device, lost features.
            include: Lost my home phone after fiber; alarm system stopped; number didn't transfer.
            exclude: General voice problems not tied to migration (TEC.SVC.VOICE).
            examples:
              - "Since they switched me to fiber my home phone number doesn't work."
              - "My alarm system stopped working after the fiber install."
              - "My phone number didn't transfer over when I upgraded."
            keywords: [since fiber, switched to fiber, alarm system, number didn't transfer, port, after the upgrade]
            mapping: {ticket_category: technical, ticket_subcategory: equipment_fault, sap_reason: ZF13}
            churn_risk: true
      - id: FBR.CON
        name: Construction
        leaves:
          - id: FBR.CON.CONSTRUCTION_CONCERN
            name: Fiber construction concern
            definition: Concerns about fiber construction activity — crews on property, flags/paint, locates, noise, access.
            include: Crews digging in my yard; flags in my lawn; who gave permission; boring under driveway.
            exclude: Damage already done (INS.FLD.PROPERTY_DAMAGE).
            examples:
              - "There are crews digging in my front yard, who gave them permission?"
              - "Someone put flags and paint all over my lawn."
              - "How long is the construction on my street going to last?"
            keywords: [crews, digging, flags, paint, construction, permission, boring, locate]
            mapping: {ticket_category: installation, ticket_subcategory: drop_line, sap_reason: ZF21}
            churn_risk: false

