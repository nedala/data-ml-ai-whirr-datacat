            examples:
              - "I've been on hold for over an hour."
              - "This is the fourth time I've been transferred."
              - "I got disconnected after waiting forty minutes."
            keywords: [on hold, hour, transferred, waiting, disconnected while on hold, bounced around]
            mapping: {ticket_category: account, ticket_subcategory: cancel_request, sap_reason: ZX12}
            churn_risk: true
